name: Normalize package lock

on:
  push:
    branches: [fix/normalize-package-lock]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/normalize-package-lock

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Normalize lockfile
        run: npm install --package-lock-only --workspaces=false --ignore-scripts --no-audit --no-fund

      - name: Commit normalized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Normalize root package lock"
          git push origin HEAD:fix/normalize-package-lock
